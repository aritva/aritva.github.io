<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aritva</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f2ec;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  padding: 15px 20px;
  background: white;
  position: sticky;
  top: 0;
}

.logo {
  font-weight: bold;
}

/* HERO */
.hero {
  background: url('https://images.unsplash.com/photo-1520974735194-6d9e7c6d1c50') center/cover;
  color: white;
  padding: 60px 20px;
  text-align: center;
}

.hero h1 {
  font-size: 28px;
}

/* SECTION */
.section {
  padding: 20px;
}

.section h2 {
  text-align: center;
}

/* CATEGORIES */
.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
}

.cat {
  min-width: 120px;
  text-align: center;
}

.cat img {
  width: 100%;
  border-radius: 10px;
}

/* PRODUCTS */
.products {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}

.product {
  background: white;
  border-radius: 10px;
  padding: 10px;
}

.product img {
  width: 100%;
  border-radius: 10px;
}

.btn {
  display: block;
  text-align: center;
  background: black;
  color: white;
  padding: 10px;
  margin-top: 10px;
  text-decoration: none;
  border-radius: 6px;
}
</style>
</head>

<body>

<nav>
  <div class="logo">Aritva 👗</div>
</nav>

<!-- HERO -->
<div class="hero">
  <h1>Everyday Kurtis, On Repeat</h1>
  <p>Soft fits. Breathable fabrics.</p>
</div>

<!-- CATEGORIES -->
<div class="section">
  <h2>Shop By Category</h2>
  <div class="categories">
    <div class="cat">
      <img src="https://via.placeholder.com/150">
      <p>College Wear</p>
    </div>
    <div class="cat">
      <img src="https://via.placeholder.com/150">
      <p>Office Wear</p>
    </div>
    <div class="cat">
      <img src="https://via.placeholder.com/150">
      <p>Daily Wear</p>
    </div>
  </div>
</div>

<!-- PRODUCTS -->
<div class="section">
  <h2>Best Sellers</h2>
  <div class="products">

    <div class="product">
      <img src="https://via.placeholder.com/300">
      <p>Black Kurti</p>
      <p>₹899</p>
      <a class="btn" href="https://wa.me/91XXXXXXXXXX">Order</a>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/300">
      <p>Purple Kurti</p>
      <p>₹999</p>
      <a class="btn" href="https://wa.me/91XXXXXXXXXX">Order</a>
    </div>

  </div>
</div>

</body>
</html>
