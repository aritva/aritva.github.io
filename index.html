<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aritva</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f6f2ec;
}

/* NAV */
nav {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  background: white;
}

.cart-box {
  background: white;
  padding: 10px;
  position: sticky;
  bottom: 0;
}

/* PRODUCTS */
.products {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
  padding: 10px;
}

.product {
  background: white;
  padding: 10px;
  border-radius: 10px;
}

.product img {
  width: 100%;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border: none;
  background: black;
  color: white;
  border-radius: 5px;
}
</style>
</head>

<body>

<nav>
  <h3>Aritva 👗</h3>
  <div>🛒 Cart: <span id="count">0</span></div>
</nav>

<div class="products">

  <div class="product">
    <img src="https://via.placeholder.com/300">
    <p>Floral Kurti</p>
    <p>₹899</p>
    <button onclick="addToCart(899)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/300">
    <p>Office Kurti</p>
    <p>₹999</p>
    <button onclick="addToCart(999)">Add to Cart</button>
  </div>

</div>

<!-- CART -->
<div class="cart-box">
  <p>Total: ₹<span id="total">0</span></p>
  
  <!-- PAYMENT -->
  <a href="https://rzp.io/l/YOURLINK">
    <button>Pay Now</button>
  </a>

  <!-- WHATSAPP -->
  <a href="https://wa.me/91XXXXXXXXXX">
    <button>Order on WhatsApp</button>
  </a>
</div>

<script>
let total = 0;
let count = 0;

function addToCart(price) {
  total += price;
  count++;

  document.getElementById("total").innerText = total;
  document.getElementById("count").innerText = count;
}
</script>

</body>
</html>
