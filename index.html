<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aritva</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f2ec;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  padding: 12px;
  background: white;
  position: sticky;
  top: 0;
}

.logo {
  font-weight: bold;
}

/* SEARCH */
.search {
  padding: 10px;
  width: 90%;
  margin: 10px auto;
  display: block;
  border-radius: 20px;
  border: 1px solid #ccc;
}

/* HERO */
.hero {
  background: url('https://images.unsplash.com/photo-1495121605193-b116b5b09a27') center/cover;
  color: white;
  padding: 60px 20px;
  text-align: center;
}

/* PRODUCTS */
.products {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
  padding: 10px;
}

.product {
  background: white;
  border-radius: 10px;
  padding: 10px;
  position: relative;
}

.product img {
  width: 100%;
  border-radius: 10px;
}

/* HEART */
.heart {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 18px;
}

/* BUTTON */
.btn {
  display: block;
  background: black;
  color: white;
  text-align: center;
  padding: 8px;
  text-decoration: none;
  border-radius: 5px;
  margin-top: 5px;
}
</style>
</head>

<body>

<nav>
  <div class="logo">Aritva 👗</div>
  <div>🛒</div>
</nav>

<input class="search" placeholder="Search kurtis, dresses..." />

<div class="hero">
  <h2>New Arrivals</h2>
  <p>Custom stitched fashion</p>
</div>

<div class="products">

  <div class="product">
    <span class="heart">♡</span>
    <img src="https://via.placeholder.com/300">
    <p>Floral Kurti</p>
    <p>₹899</p>
    <a class="btn" href="https://wa.me/91XXXXXXXXXX">Buy</a>
  </div>

  <div class="product">
    <span class="heart">♡</span>
    <img src="https://via.placeholder.com/300">
    <p>Office Kurti</p>
    <p>₹999</p>
    <a class="btn" href="https://wa.me/91XXXXXXXXXX">Buy</a>
  </div>

</div>

</body>
</html>
