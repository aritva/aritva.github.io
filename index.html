<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aritva</title>

<style>
body {
  margin: 0;
  font-family: 'Georgia', serif;
  background: #fff;
  color: #222;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 30px;
  border-bottom: 1px solid #eee;
}

.logo {
  font-weight: bold;
  font-size: 20px;
  letter-spacing: 2px;
}

/* HERO */
.hero {
  height: 90vh;
  background: url('https://images.unsplash.com/photo-1495121605193-b116b5b09a27') center/cover;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  text-align: center;
}

.hero h1 {
  font-size: 48px;
}

.hero p {
  font-size: 18px;
}

.btn {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 25px;
  background: #000;
  color: #fff;
  text-decoration: none;
}

/* SECTION */
.section {
  padding: 60px 20px;
  text-align: center;
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap: 15px;
}

.gallery img {
  width: 100%;
  height: 300px;
  object-fit: cover;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  background: #000;
  color: white;
}
</style>
</head>

<body>

<nav>
  <div class="logo">ARITVA 👗</div>
</nav>

<div class="hero">
  <div>
    <h1>Timeless Elegance</h1>
    <p>Custom couture by Neha</p>
    <a class="btn" href="#contact">Order Now</a>
  </div>
</div>

<div class="section">
  <h2>About</h2>
  <p>At Aritva, we design custom outfits tailored perfectly to your style and comfort.</p>
</div>

<div class="section gallery">
  <img src="https://images.unsplash.com/photo-1520974735194-6d9e7c6d1c50">
  <img src="https://images.unsplash.com/photo-1521335629791-ce4aec67dd53">
  <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d">
</div>

<div class="section" id="contact">
  <h2>Order Now</h2>
  <a class="btn" href="https://wa.me/91XXXXXXXXXX">Chat on WhatsApp</a>
</div>

<footer>
  © Aritva | Crafted with passion
</footer>

</body>
</html>
